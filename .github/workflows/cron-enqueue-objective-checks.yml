name: Cron - enqueue-objective-checks

# Remplace l'ancien cron Vercel (plan Hobby limité à 1 exécution/jour, cf. `vercel.json` avant
# ce commit et `docs/adr/ADR-011-traitements-periodiques-file-de-jobs.md`). Même horaire que
# l'origine Vercel : "0 6 * * *" (quotidien, 06:00 UTC).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/v1/cron/enqueue-objective-checks
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/v1/cron/enqueue-objective-checks"
