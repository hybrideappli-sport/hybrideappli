name: Cron - purge-stripe-events

# Remplace l'ancien cron Vercel (plan Hobby limité à 1 exécution/jour, cf. `vercel.json` avant
# ce commit et `docs/adr/ADR-011-traitements-periodiques-file-de-jobs.md`). Même horaire que
# l'origine Vercel : "30 3 * * *" (quotidien, 03:30 UTC).
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/v1/cron/purge-stripe-events
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/v1/cron/purge-stripe-events"
